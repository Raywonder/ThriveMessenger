[server]
host = im.tappedin.fm
port = 2005
max_retries = 5
retry_timeout = 15

[updates]
; Optional: hosted JSON feed your clients should try first.
; If empty, updater will use preferred_repo/fallback_repos only.
feed_url = https://im.tappedin.fm/updates/latest.json

; Optional additional hosted feeds checked in parallel with feed_url.
; Add only real unauthenticated JSON feed URLs; do not add placeholders.
fallback_feed_urls =

; Optional repo order used when feed_url is empty/unavailable.
preferred_repo = Raywonder/ThriveMessenger
fallback_repos = G4p-Studios/ThriveMessenger
