name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "client.conf"
      - "sounds/**"
      - ".github/workflows/build-windows.yml"
      - "pyproject.toml"
      - "scripts/build_windows.ps1"
      - "thrive_messenger_installer.iss"
      - "vdata.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-versionfile keyring plyer wxPython

      - name: Build one-folder app
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -OutputDir "dist-windows"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc ".\thrive_messenger_installer.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thrive-messenger-windows-portable
          path: dist-windows/thrive_messenger.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: thrive-messenger-windows-installer
          path: dist-windows/thrive_messenger_installer.exe
          if-no-files-found: error
