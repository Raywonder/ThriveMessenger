[server]
port = 2005

[smtp]
code_expires = 5m

[bots]
names = assistant-bot,helper-bot,Clawdia
ollama_enabled = true
ollama_url = http://127.0.0.1:11434
ollama_model = llama3.2
ollama_timeout = 20
status_map = assistant-bot:online,helper-bot:online,Clawdia:Feel free to chat with me
purpose_map = assistant-bot:general app helper,helper-bot:service specialist,Clawdia:AI chat assistant with persistent per-user memory
service_map = assistant-bot:chat contacts settings server manager file transfer admin tools,helper-bot:troubleshooting account login notifications updates,Clawdia:chat support onboarding account help server guidance
memory_messages_per_user = 80
default_bot_contacts = Clawdia

[welcome]
enabled = true
pre_login = Welcome to Thrive Messenger. This server supports native Thrive authentication and can also support WordPress authentication through the Thrive Server Sync plugin for any WordPress site, letting users and admins link their WordPress and Thrive accounts while site admins can manage server users from the WordPress admin dashboard.
post_login =

[wordpress]
enabled = false
sync_secret =
allow_admin_sync = true
signature_window_seconds = 300
provision_url =
auto_provision_wordpress = true
