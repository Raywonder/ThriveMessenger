name: ThriveMessenger
options:
  bundleIdPrefix: fm.tappedin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  ThriveMessenger:
    type: application
    platform: iOS
    sources:
      - path: ThriveMessenger
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: fm.tappedin.thrive-messenger
      INFOPLIST_FILE: ThriveMessenger/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: Thrive Messenger
      INFOPLIST_KEY_NSMicrophoneUsageDescription: Thrive Messenger uses the microphone for voice calls.
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Thrive Messenger uses speech recognition only when you enable an accessibility feature that needs it.
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
