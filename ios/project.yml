name: ThriveMessenger
options:
  bundleIdPrefix: fm.tappedin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: G5232LU4Z7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "15.20"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ThriveMessenger:
    type: application
    platform: iOS
    sources: [ThriveMessenger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.tappedin.thrivemessenger
        PRODUCT_NAME: Thrive Messenger
        INFOPLIST_FILE: ThriveMessenger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  ThriveMessengerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ThriveMessengerUITests]
    dependencies:
      - target: ThriveMessenger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.tappedin.thrivemessenger.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ThriveMessenger:
    build:
      targets:
        ThriveMessenger: all
    test:
      targets: [ThriveMessengerUITests]
